server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # HTML/JS har safar yangilanganini tekshirsin (telefonda eski nusxa qolib ketmasin)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    # Rasm nomlari tarkibida hash bor, shuning uchun uzoq saqlash xavfsiz
    location /images/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
